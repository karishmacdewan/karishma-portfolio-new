<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge graph with an anomalous relationship</title>
  <desc id="desc">A dense constellation of connected entities arranged into knowledge graph communities, with one anomalous node highlighted.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="48%" r="76%">
      <stop offset="0" stop-color="#102b46"/>
      <stop offset=".52" stop-color="#071827"/>
      <stop offset="1" stop-color="#02070d"/>
    </radialGradient>
    <radialGradient id="node" cx="38%" cy="32%" r="70%">
      <stop stop-color="#d8ffff"/>
      <stop offset=".28" stop-color="#58dddf"/>
      <stop offset="1" stop-color="#12668b"/>
    </radialGradient>
    <radialGradient id="violetNode" cx="38%" cy="32%" r="70%">
      <stop stop-color="#fff0ff"/>
      <stop offset=".28" stop-color="#d88bff"/>
      <stop offset="1" stop-color="#7137b9"/>
    </radialGradient>
    <linearGradient id="activePath" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58f2d5"/>
      <stop offset=".52" stop-color="#6fa8ff"/>
      <stop offset="1" stop-color="#dc72ff"/>
    </linearGradient>
    <pattern id="microGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8ebbd2" stroke-opacity=".055"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wideGlow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <rect width="1600" height="1000" fill="url(#microGrid)"/>

  <g fill="none" stroke="#75b4c9" stroke-linecap="round">
